[build]
  publish = "."

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "paywall.js,index.html,portal.html,netlify/functions/auth-config.js,netlify/functions/create-checkout.js,netlify/functions/create-portal.js,netlify/functions/verify-customer-access.js"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[functions]
  directory = "netlify/functions"


[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self' blob:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; frame-src 'self' https://www.googletagmanager.com; form-action 'self'; upgrade-insecure-requests"

[[redirects]]
  from = "/start-a-nonprofit-illinois"
  to = "/start-a-nonprofit-illinois.html"
  status = 200

